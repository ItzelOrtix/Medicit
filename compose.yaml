services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=medikitos
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password_medikitos
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medikitos"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/medikitos
      - DB_USER=postgres
      - DB_PASSWORD=password_medikitos
      - JWT_SECRET=mi_clave_super_segura_de_32_caracteres_minimo_123456
      - JWT_EXPIRATION_WEB=86400000
      - ADMIN_CORREO=admin@medikitos.com
      - ADMIN_USUARIO=admin
      - ADMIN_CONTRASENA=admin123

  frontend:
    build:
      context: ./frontend
    ports:
      - 8106:80
    depends_on:
      - server

volumes:
  db-data:
