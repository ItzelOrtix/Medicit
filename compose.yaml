# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  postgres:
    image: postgres:16

    environment:
      - POSTGRES_DB=medikitos
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password_medikitos

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medikitos"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/medikitos
      - DB_USER=postgres
      - DB_PASSWORD=password_medikitos
      - JWT_SECRET=mi_clave_super_segura_de_32_caracteres_minimo_123456
      - JWT_EXPIRATION_WEB=86400000
      - ADMIN_CORREO=admin@medikitos.com
      - ADMIN_USUARIO=admin
      - ADMIN_CONTRASENA=admin123

  frontend:
    build:
      context: ./frontend

    ports:
      - 8106:80

    depends_on:
      - server

volumes:
  db-data:

